services:
  mmn-web:
    image: nginx:1.27-alpine
    container_name: mmn-web
    restart: unless-stopped
    ports:
      - "${MMN_HTTP_PORT:-8765}:80"
    volumes:
      - ./deploy/nginx-runtime:/etc/nginx/conf.d:ro
    depends_on:
      mmn-app:
        condition: service_healthy
    networks:
      - mmn_net

  mmn-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mmn-perception-engine:${MMN_IMAGE_TAG:-latest}
    container_name: mmn-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MMN_HOST: ${MMN_HOST:-0.0.0.0}
      MMN_PORT: ${MMN_PORT:-8765}
      MMN_PUBLIC_BASE_URL: ${MMN_PUBLIC_BASE_URL:-}
      MMN_AUTO_OPEN_BROWSER: "false"
      MMN_DESKTOP_BRIDGE_ENABLED: "false"
      MMN_CLOUD_LOGIN_REQUIRED: ${MMN_CLOUD_LOGIN_REQUIRED:-true}
      MMN_AUTH_SECRET: ${MMN_AUTH_SECRET:?MMN_AUTH_SECRET must be configured}
      MMN_SCHEDULER_SECRET: ${MMN_SCHEDULER_SECRET:?MMN_SCHEDULER_SECRET must be configured}
      MMN_TRIAL_REQUEST_WINDOW_SECONDS: ${MMN_TRIAL_REQUEST_WINDOW_SECONDS:-60}
      MMN_TRIAL_REQUEST_LIMIT: ${MMN_TRIAL_REQUEST_LIMIT:-12}
      MMN_TRIAL_CONCURRENCY_LIMIT: ${MMN_TRIAL_CONCURRENCY_LIMIT:-2}
      MMN_TRUSTED_PROXY_CIDRS: ${MMN_TRUSTED_PROXY_CIDRS:-127.0.0.0/8,::1/128}
      MMN_ADMIN_USERNAME: ${MMN_ADMIN_USERNAME:-Ellis}
      MMN_ADMIN_PASSWORD: ${MMN_ADMIN_PASSWORD:-}
      MMN_TRIAL_USERNAME: ${MMN_TRIAL_USERNAME:-MMN}
      MMN_TRIAL_PASSWORD: ${MMN_TRIAL_PASSWORD:-}
      MMN_DATA_ROOT: /app/data
      MMN_DATA_DIR: /app/data
      MMN_BACKUP_ROOT: /app/backups
      MMN_DB_PATH: /app/data/commercial_demo.db
      MMN_DOUYIN_COLLECTOR_NODE: /usr/bin/node
      MMN_DOUYIN_COLLECTOR_NODE_MODULES: /app/node_modules
      MMN_DOUYIN_BROWSER_EXECUTABLE: /usr/bin/chromium
      DATABASE_URL: ${DATABASE_URL:-postgresql://mmn:${POSTGRES_PASSWORD:-change-me}@mmn-db:5432/mmn}
    expose:
      - "8765"
    volumes:
      - mmn_data:/app/data
      - mmn_backups:/app/backups
      - mmn_logs:/app/logs
    depends_on:
      mmn-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mmn_net

  mmn-db:
    image: pgvector/pgvector:pg16
    container_name: mmn-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mmn}
      POSTGRES_USER: ${POSTGRES_USER:-mmn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - mmn_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mmn} -d ${POSTGRES_DB:-mmn}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mmn_net

  redis:
    image: redis:7-alpine
    container_name: mmn-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - mmn_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mmn_net

  mmn-creator-worker:
    image: mmn-perception-engine:${MMN_IMAGE_TAG:-latest}
    container_name: mmn-creator-worker
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://mmn:${POSTGRES_PASSWORD:-change-me}@mmn-db:5432/mmn}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MMN_CREATOR_DB_PATH: /app/data/creator_distillation.db
    command: ["celery", "-A", "creator_distillation.tasks:celery_app", "worker", "-Q", "creator-distillation", "--loglevel=INFO", "--concurrency=2"]
    volumes:
      - mmn_data:/app/data
      - mmn_logs:/app/logs
    depends_on:
      redis: {condition: service_healthy}
      mmn-db: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery -A creator_distillation.tasks:celery_app inspect ping --destination celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks: [mmn_net]

  mmn-social-evidence-worker:
    profiles: ["social-evidence-v2"]
    image: mmn-perception-engine:${MMN_IMAGE_TAG:-latest}
    container_name: mmn-social-evidence-worker
    restart: unless-stopped
    env_file: [.env]
    environment:
      MMN_SOCIAL_EVIDENCE_V2_ENABLED: "true"
      MMN_SOCIAL_EVIDENCE_WORKER_MODE: external
      MMN_SOCIAL_EVIDENCE_DB: /app/data/social_evidence.sqlite
      MMN_SOCIAL_EVIDENCE_RAW_DIR: /app/data/social_evidence_raw
    command: ["python3", "scripts/run_social_evidence_worker.py", "--poll-seconds", "2"]
    volumes:
      - mmn_data:/app/data
      - mmn_logs:/app/logs
    networks: [mmn_net]

  mmn-scheduler:
    image: mmn-perception-engine:${MMN_IMAGE_TAG:-latest}
    container_name: mmn-scheduler
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MMN_DATA_ROOT: /app/data
      MMN_DATA_DIR: /app/data
      MMN_BACKUP_ROOT: /app/backups
      MMN_DB_PATH: /app/data/commercial_demo.db
    command: ["bash", "scripts/run_scheduler.sh"]
    volumes:
      - mmn_data:/app/data
      - mmn_backups:/app/backups
      - mmn_logs:/app/logs
    depends_on:
      mmn-app:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "test -f /app/logs/scheduler.log"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - mmn_net

networks:
  mmn_net:
    driver: bridge

volumes:
  mmn_data:
  mmn_backups:
  mmn_logs:
  mmn_postgres:
  mmn_redis:
