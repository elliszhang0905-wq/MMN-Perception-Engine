server {
    listen 80;
    server_name mmnsh.com www.mmnsh.com _;

    client_max_body_size 100m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location = /data/thailand_social_market_latest.json {
        proxy_pass http://mmn-app:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-MMN-Scheduler "";
        proxy_set_header X-MMN-Scheduler-Token "";
        proxy_set_header X-MMN-Scheduler-Timestamp "";
        proxy_set_header X-MMN-Scheduler-Signature "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ~* ^/(?:data|backups|logs|docs|migrations|scripts|tests|src|bf_factory|creator_distillation|mmn_eval)(?:/|$) {
        return 404;
    }

    location ~* (^|/)\. {
        return 404;
    }

    location ~* \.(?:py|pyc|db|sqlite|sqlite3|log|env|ini|toml|ya?ml|md|txt|sh|lock|mjs)$ {
        return 404;
    }

    location ~* ^/(?:Dockerfile|docker-compose(?:\.[^/]+)?|package(?:-lock)?\.json|pnpm-lock\.yaml|requirements[^/]*|README[^/]*|VERSION[^/]*)$ {
        return 404;
    }

    location / {
        proxy_pass http://mmn-app:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-MMN-Scheduler "";
        proxy_set_header X-MMN-Scheduler-Token "";
        proxy_set_header X-MMN-Scheduler-Timestamp "";
        proxy_set_header X-MMN-Scheduler-Signature "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
