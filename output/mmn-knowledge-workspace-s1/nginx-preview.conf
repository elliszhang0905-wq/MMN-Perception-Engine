worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 8080;
        root /srv/preview;
        autoindex off;
        add_header X-MMN-Preview-Version "s1-20260908-1" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'" always;
        location = / { limit_except GET { deny all; } try_files /index.html =404; }
        location = /index.html { limit_except GET { deny all; } try_files $uri =404; }
        location = /prototype.css { limit_except GET { deny all; } try_files $uri =404; }
        location = /prototype.js { limit_except GET { deny all; } try_files $uri =404; }
        location = /mmn-logo.png { limit_except GET { deny all; } try_files $uri =404; }
        location / { return 404; }
    }
}
